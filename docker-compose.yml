services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_eventos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # prisma generate no start: o volume nomeado node_modules sobrepõe o
    # client gerado no build da imagem; sem isto, o client do volume fica
    # obsoleto quando o schema muda (Unknown argument em campos novos).
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/sistema_eventos?schema=public"
      PORT: "3030"
      NODE_ENV: development
      JWT_SECRET: "dev-secret-local"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      EMAIL_FROM: "${EMAIL_FROM:-Seciteci Eventos <nao-responder@seciteci.local>}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      # credenciais do admin usado pelo seed (sobrescreva via .env/shell se quiser)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@eventos.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    ports:
      - "3030:3030"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
