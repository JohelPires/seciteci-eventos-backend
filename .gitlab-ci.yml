# Publicação automática na VM da SECITECI pelo modelo de CI do grupo
# (fic_dev/secitec-servidor — README explica a convenção inteira).
#
# Fluxo: push/merge na `main` (protegida) → pipeline → `publicar:producao`
# roda SEM botão → runner `secitec-vps` (shell, na VM) builda a imagem,
# copia o compose.yml e escreve o /opt/apps/conectese-api/prod/.env, sobe
# com `docker compose up -d --wait` e espera healthcheck /health.
#
# Pré-requisitos (uma vez): branch `main` protegida e a variável APP_ENV
# (tipo File) no escopo `producao` — sem ela o job para com mensagem clara.
# Endereço da API: https://apps.risc.unemat.br/dev/secitec/conectese-api

include:
  - project: 'fic_dev/secitec-servidor'
    file: 'gitlab/deploy.gitlab-ci.yml'

variables:
  # O <app> do endereço e das pastas /opt/apps/conectese-api/prod.
  APP: conectese-api

# Deploy AUTOMÁTICO: o modelo deixa produção como manual (`when: manual`
# em .ambiente:producao). Uma definição local de MESMO NOME sobrescreve a
# do template — `extends` reaplica o corpo do job e as variáveis da
# convenção (APP_CAMINHO, HOST_PUBLICO, COMPOSE_ARQUIVO, etc.), e a regra
# local troca apenas o gatilho. resource_group do `.publicar-na-vm`
# (conectese-api-prod) continua garantindo um deploy por vez.
publicar:producao:
  extends: [.publicar-na-vm, .ambiente:producao]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Seed do banco de produção (uma vez, botão): categorias base (Ciência,
# Tecnologia, Inovação) + usuário admin. O e-mail/senha do admin vêm das
# variáveis ADMIN_EMAIL/ADMIN_PASSWORD — adicione-as à APP_ENV (File) no
# GitLab. Depende do `publicar:producao` já ter rodado.
seed:producao:
  stage: deploy
  tags: [secitec-vps]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - docker compose -p conectese-api-prod -f /opt/apps/conectese-api/prod/compose.yml exec -T app npm run prisma:seed

# Publicação do BACKEND na VM do Conecte-se (SECITEC-29949, endereço
# conectese.secitec.mt.gov.br) pelo runner de projeto `conectese-prod (.237)`.
# A pipeline constrói a imagem e troca o container `conectese.backend.api`
# (mesmo nome/projeto/rede do compose de lá); o .env do app vem extraído do
# container anterior pela pipeline, gravado como 600 em
# /home/gitlab-runner/conectese-api.env (fora do trace).
publicar:producao:conectese:
  stage: deploy
  tags: [conectese-prod]
  interruptible: false
  resource_group: conectese-api-237
  environment:
    name: producao
    deployment_tier: production
    url: https://conectese.secitec.mt.gov.br/api
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      echo "### build da imagem"
      DOCKER_BUILDKIT=1 docker build -f Dockerfile \
        -t "conectese-api:${CI_COMMIT_SHORT_SHA}" -t "conectese-api:latest" .
      echo "### subir (troca o container atual) + migrations rodando no CMD da imagem"
      docker compose -p seciteci-eventos-backend \
        -f deploy/conectese/compose.yml up -d --force-recreate --wait --wait-timeout 240
      echo "### sanity check"
      docker exec conectese.backend.api wget -qO- http://127.0.0.1:80/health; echo
      curl -sk --max-time 15 -o /dev/null -w '/api/eventos HTTP %{http_code}\n' 'https://conectese.secitec.mt.gov.br/api/eventos?limit=1'
