# Fluxo:
#   - push na branch `dev` (protegida) → `publicar:risc` publica AUTOMATICAMENTE
#     na VM do RISC: https://apps.risc.unemat.br/dev/secitec/conectese-api
#     (runner `secitec-vps`, shell, Protected só roda em refs protegidas);
#   - push na `main` → `publicar:producao:conectese` publica AUTOMATICAMENTE
#     na VM do Conecte-se: https://conectese.secitec.mt.gov.br/api
# O botão manual `publicar:producao` do template continua disponível na
# pipeline da `main` (publicação de emergência do RISC por commit).

include:
  - project: 'fic_dev/secitec-servidor'
    file: 'gitlab/deploy.gitlab-ci.yml'

variables:
  # O <app> do endereço e das pastas /opt/apps/conectese-api/prod.
  APP: conectese-api

# Deploy AUTOMÁTICO na VM do RISC: a branch `dev` é o ambiente de
# homologação/integração. O corpo vem do modelo (.publicar-na-vm +
# .ambiente:producao): mesmo endereço (sem sufixo -dev), mesma pasta
# /opt/apps/conectese-api/prod e a APP_ENV de escopo `*`.
# PRÉ-REQUISITO: branch `dev` protegida (runner é Protected).
publicar:risc:
  extends: [.publicar-na-vm, .ambiente:producao]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  environment:
    name: risc
    deployment_tier: staging
    url: https://apps.risc.unemat.br/dev/secitec/conectese-api

# Seed do banco do RISC (uma vez, botão): categorias base (Ciência,
# Tecnologia, Inovação) + usuário admin. O e-mail/senha do admin vêm das
# variáveis ADMIN_EMAIL/ADMIN_PASSWORD — adicione-as à APP_ENV (File) no
# GitLab. Depende do `publicar:risc` já ter rodado.
seed:producao:
  stage: deploy
  tags: [secitec-vps]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - docker compose -p conectese-api-prod -f /opt/apps/conectese-api/prod/compose.yml exec -T app npm run prisma:seed

# Publicação do BACKEND na VM do Conecte-se (SECITEC-29949, endereço
# conectese.secitec.mt.gov.br) pelo runner de projeto `conectese-prod (.237)`.
# A pipeline constrói a imagem e troca o container `conectese.backend.api`
# (mesmo nome/projeto/rede do compose de lá). O .env do app vem da variável
# APP_ENV (File, Protected, escopo `conectese-api-prod`) e é gravado como 600
# em /home/gitlab-runner/conectese-api.env antes do compose up.
publicar:producao:conectese:
  stage: deploy
  tags: [conectese-prod]
  interruptible: false
  resource_group: conectese-api-237
  environment:
    name: conectese-api-prod
    deployment_tier: production
    url: https://conectese.secitec.mt.gov.br/api
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      echo "### env do app (da variável APP_ENV, escopo conectese-api-prod)"
      test -f "${APP_ENV:-}" || { echo "ERRO: falta APP_ENV (File, escopo conectese-api-prod)"; exit 1; }
      echo "chaves:"; cut -d= -f1 "$APP_ENV" | sort -u | sed 's/^/  - /'
      ARQ=/home/gitlab-runner/conectese-api.env
      if [ -f "$ARQ" ]; then
        TS=$(date +%Y%m%d%H%M%S)
        cp -p "$ARQ" "${ARQ}.bak.${TS}" && chmod 600 "${ARQ}.bak.${TS}"
        echo "backup do env anterior: ${ARQ}.bak.${TS}"
      fi
      umask 077; install -m 600 -- "$APP_ENV" "${ARQ}.novo" && mv "${ARQ}.novo" "$ARQ"
      chmod 600 "$ARQ"
      echo "### build da imagem"
      DOCKER_BUILDKIT=1 docker build -f Dockerfile \
        -t "conectese-api:${CI_COMMIT_SHORT_SHA}" -t "conectese-api:latest" .
      echo "### subir (troca o container atual) + migrations rodando no CMD da imagem"
      docker compose -p seciteci-eventos-backend \
        -f deploy/conectese/compose.yml up -d --force-recreate --wait --wait-timeout 240
      echo "### sanity check"
      docker exec conectese.backend.api wget -qO- http://127.0.0.1:80/health; echo
      echo "### chaves no container (nomes)"
      docker exec conectese.backend.api sh -c 'env | cut -d= -f1' | sort -u | grep -E '^(DATABASE_URL|JWT_SECRET|POSTGRES_|PORT|NODE_ENV|EMAIL_|SMTP_)' || true
      curl -sk --max-time 15 -o /dev/null -w '/api/eventos HTTP %{http_code}\n' 'https://conectese.secitec.mt.gov.br/api/eventos?limit=1'


# DIAGNÓSTICO TEMPORÁRIO — contagens do banco do Conecte-se (read-only).
diag:db:
  stage: .pre
  tags: [conectese-prod]
  interruptible: true
  timeout: 6m
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - |
      set +e
      echo "### DB alvo (host/banco apenas)"
      docker exec conectese.backend.api node -e 'const u=process.env.DATABASE_URL||"";const h=/@([^:\/?]+)/.exec(u);const d=/\/([^\/?]+)/.exec(u);console.log("host=",(h&&h[1]||"?"),"db=",(d&&d[1]||"?"))'
      echo "### contagens e últimas linhas"
      docker exec conectese.backend.api node -e '
       const {PrismaClient}=require("@prisma/client");
       const p=new PrismaClient();
       (async()=>{
         const ev=await p.$queryRawUnsafe("SELECT id,titulo,data_criacao FROM eventos ORDER BY id DESC LIMIT 5");
         const cats=await p.$queryRawUnsafe("SELECT id,nome FROM categorias ORDER BY id");
         const mg=await p.$queryRawUnsafe("SELECT migration_name FROM _prisma_migrations ORDER BY migration_name");
         const users=await p.$queryRawUnsafe("SELECT id,email,tipo_usuario FROM usuarios ORDER BY id LIMIT 12");
         console.log("EVENTOS "+JSON.stringify(ev));
         console.log("CATEGORIAS "+JSON.stringify(cats));
         console.log("MIGRATIONS "+JSON.stringify(mg));
         console.log("USUARIOS "+JSON.stringify(users));
         await p.$disconnect();
       })().catch(e=>{console.error("ERR "+(e.code||e.message));process.exit(1)});
      '
