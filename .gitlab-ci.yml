# Publicação automática na VM da SECITECI pelo modelo de CI do grupo
# (fic_dev/secitec-servidor — README explica a convenção inteira).
#
# Fluxo: push/merge na `main` (protegida) → pipeline → `publicar:producao`
# roda SEM botão → runner `secitec-vps` (shell, na VM) builda a imagem,
# copia o compose.yml e escreve o /opt/apps/conectese-api/prod/.env, sobe
# com `docker compose up -d --wait` e espera healthcheck /health.
#
# Pré-requisitos (uma vez): branch `main` protegida e a variável APP_ENV
# (tipo File) no escopo `producao` — sem ela o job para com mensagem clara.
# Endereço da API: https://apps.risc.unemat.br/dev/secitec/conectese-api

include:
  - project: 'fic_dev/secitec-servidor'
    file: 'gitlab/deploy.gitlab-ci.yml'

variables:
  # O <app> do endereço e das pastas /opt/apps/conectese-api/prod.
  APP: conectese-api

# Deploy AUTOMÁTICO: o modelo deixa produção como manual (`when: manual`
# em .ambiente:producao). Uma definição local de MESMO NOME sobrescreve a
# do template — `extends` reaplica o corpo do job e as variáveis da
# convenção (APP_CAMINHO, HOST_PUBLICO, COMPOSE_ARQUIVO, etc.), e a regra
# local troca apenas o gatilho. resource_group do `.publicar-na-vm`
# (conectese-api-prod) continua garantindo um deploy por vez.
publicar:producao:
  extends: [.publicar-na-vm, .ambiente:producao]
  rules:
    # TEMPORÁRIO (commit de diagnóstico): manual para não publicar de novo.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Seed do banco de produção (uma vez, botão): categorias base (Ciência,
# Tecnologia, Inovação) + usuário admin. O e-mail/senha do admin vêm das
# variáveis ADMIN_EMAIL/ADMIN_PASSWORD — adicione-as à APP_ENV (File) no
# GitLab. Depende do `publicar:producao` já ter rodado.
seed:producao:
  stage: deploy
  tags: [secitec-vps]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - docker compose -p conectese-api-prod -f /opt/apps/conectese-api/prod/compose.yml exec -T app npm run prisma:seed

# Publicação do BACKEND na VM do Conecte-se (runner `conectese-prod (.237)`,
# projeto 688). Build da imagem, substituição do container
# `conectese.backend.api` (mesmo nome/projeto/rede do compose de lá) e
# verificação do /health. O banco de produção foi POPULADO ANTES do primeiro
# `prisma migrate` rodar, então ao subir o banco a primeira vez o job executa
# `prisma migrate resolve --applied` (baseline) para marcar as migrations.
# O segredo (env_file com POSTGRES_*/DATABASE_URL/JWT_SECRET) é o mesmo do
# container anterior, extraído pela pipeline uma única vez e gravado como
# 600 em /home/gitlab-runner/conectese-api.env (fora do trace).
publicar:producao:conectese:
  stage: deploy
  tags: [conectese-prod]
  interruptible: false
  resource_group: conectese-api-237
  environment:
    name: producao
    deployment_tier: production
    url: https://conectese.secitec.mt.gov.br/api
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      NOME=conectese.backend.api
      ARQ=/home/gitlab-runner/conectese-api.env
      echo "== env do app =="
      if docker inspect "$NOME" >/dev/null 2>&1; then
        echo "container anterior: extraindo env (valores ficam no runner, nao no log)"
        umask 077
        {
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$NOME" \
            | grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_HOST|POSTGRES_PORT|DATABASE_URL|JWT_SECRET|POSTGRES_DB|NODE_ENV)=' || true
        } > "${ARQ}.tmp"
        sed -i '/^PORT=/d;/^NODE_ENV=/d' "${ARQ}.tmp"
        [ -s "${ARQ}.tmp" ] || { echo "ERRO: sem env util do container anterior"; exit 1; }
        mv "${ARQ}.tmp" "$ARQ"; chmod 600 "$ARQ"
        echo "chaves reconstruidas:"; cut -d= -f1 "$ARQ" | sort -u | sed 's/^/  - /'
      elif [ -f "$ARQ" ]; then
        echo "sem container anterior; usando $ARQ em disco"
        chmod 600 "$ARQ"
      else
        echo "ERRO: nem container anterior nem $ARQ em disco. Precisamos do .env do app."; exit 1
      fi
      test -s "$ARQ" || { echo "ERRO: $ARQ vazio"; exit 1; }
      echo "== build da imagem =="
      DOCKER_BUILDKIT=1 docker build -f Dockerfile \
        -t "conectese-api:${CI_COMMIT_SHORT_SHA}" -t "conectese-api:latest" .
      echo "== baseline das migrations (se o banco ja tinha schema) =="
      docker run --rm --network conectese-db-net \
        --env-file "$ARQ" \
        -e PORT=80 -e NODE_ENV=production \
        "conectese-api:${CI_COMMIT_SHORT_SHA}" \
        sh -c 'for m in /app/prisma/migrations/*/; do
                 n=$(basename "$m");
                 npx prisma migrate resolve --applied "$n" 2>&1 | tail -n 3;
               done' || true
      echo "== subir (troca o container atual) =="
      docker compose -p seciteci-eventos-backend \
        -f deploy/conectese/compose.yml up -d --force-recreate --wait --wait-timeout 240
      echo "== sanity check =="
      sleep 3
      docker exec "$NOME" wget -qO- http://127.0.0.1:80/health; echo
      surface=$(curl -sk --max-time 15 -o /dev/null -w '%{http_code}' https://conectese.secitec.mt.gov.br/api/eventos?limit=1)
      echo "HTTP publico /api/eventos: $surface"
      echo "== visualmente comparar =="
      docker ps --filter name=conectese.backend.api --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

